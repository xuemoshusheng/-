<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟世界里的向日葵</title>
<style>
  /* ========== 基础变量 ========== */
  :root {
    --bg-primary: #faf8f3;
    --bg-secondary: #f3efe6;
    --text-primary: #2c2c2c;
    --text-secondary: #6b6b6b;
    --text-muted: #9a9a9a;
    --accent: #d4922a;
    --accent-light: #f5d59a;
    --accent-soft: #fdf3df;
    --border: #e5e0d5;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --content-max: 720px;
    --sidebar-width: 260px;
    --font-body: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  [data-theme="dark"] {
    --bg-primary: #161824;
    --bg-secondary: #1e2130;
    --text-primary: #e4e4e8;
    --text-secondary: #a0a0ab;
    --text-muted: #6c6c7a;
    --accent: #f5b041;
    --accent-light: #c98d2a;
    --accent-soft: #2a2638;
    --border: #2a2d3d;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.85;
    transition: background 0.3s, color 0.3s;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 封面页 ========== */
  #cover-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }

  .cover-sun {
    width: 120px;
    height: 120px;
    margin-bottom: 36px;
    position: relative;
    animation: float 4s ease-in-out infinite;
  }

  .pixel-sun {
    width: 100%;
    height: 100%;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 60px var(--accent-light);
    position: relative;
  }

  .pixel-sun::before,
  .pixel-sun::after {
    content: '';
    position: absolute;
    background: var(--bg-primary);
    border-radius: 50%;
    width: 14px;
    height: 14px;
    top: 38px;
  }
  .pixel-sun::before { left: 36px; }
  .pixel-sun::after { right: 36px; }

  .sun-mouth {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 14px;
    border-bottom: 3px solid var(--bg-primary);
    border-radius: 0 0 28px 28px;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .cover-title {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-bottom: 16px;
    color: var(--text-primary);
    text-align: center;
  }

  .cover-subtitle {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 48px;
    letter-spacing: 2px;
    font-family: var(--font-ui);
  }

  .cover-desc {
    max-width: 480px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.9;
    margin-bottom: 56px;
    font-family: var(--font-ui);
  }

  .cover-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 14px 36px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-ui);
    transition: all 0.25s;
    letter-spacing: 1px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 16px rgba(212, 146, 42, 0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 146, 42, 0.4); }

  .btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* ========== 阅读主界面 ========== */
  #reader-page { display: none; min-height: 100vh; }

  .reader-layout {
    display: flex;
    min-height: calc(100vh - 56px);
    padding-top: 6px;
  }

  /* 顶部进度条 */
  .progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    background: var(--accent);
    width: 0%;
    z-index: 100;
    transition: width 0.1s linear;
  }

  /* 侧边栏 */
  .sidebar {
    width: var(--sidebar-width);
    border-right: 1px solid var(--border);
    background: var(--bg-secondary);
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 24px 0 80px;
    z-index: 50;
    transition: transform 0.3s;
  }

  .sidebar-header {
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .sidebar-title {
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-ui);
    margin-bottom: 4px;
  }

  .sidebar-sub {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-ui);
  }

  .toc-list { list-style: none; }

  .toc-act {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    font-family: var(--font-ui);
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .toc-act:hover { background: var(--accent-soft); }
  .toc-act .toggle-icon {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .toc-act.collapsed .toggle-icon { transform: rotate(-90deg); }

  .toc-chapters {
    list-style: none;
    overflow: hidden;
    transition: max-height 0.3s;
  }
  .toc-act.collapsed + .toc-chapters { max-height: 0; }

  .toc-chapter {
    padding: 8px 20px 8px 40px;
    font-size: 13.5px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-ui);
    border-left: 2px solid transparent;
    transition: all 0.2s;
  }
  .toc-chapter:hover {
    background: var(--accent-soft);
    color: var(--text-primary);
  }
  .toc-chapter.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: var(--accent-soft);
    font-weight: 500;
  }

  /* 正文区 */
  .main-content {
    margin-left: var(--sidebar-width);
    flex: 1;
    padding: 40px 60px 120px;
    transition: margin-left 0.3s;
  }

  .content-wrapper {
    max-width: var(--content-max);
    margin: 0 auto;
  }

  .chapter-header {
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .act-title {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-primary);
  }

  .section-title {
    font-size: 18px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 4px;
  }

  /* 正文段落 */
  .novel-content p {
    margin-bottom: 1.2em;
    text-indent: 2em;
    text-align: justify;
  }

  .novel-content h4 {
    font-size: 16px;
    margin: 1.8em 0 0.8em;
    color: var(--accent);
    font-weight: 600;
  }

  .novel-content .dialog {
    color: var(--text-secondary);
    font-style: italic;
  }

  /* 系统提示文字样式 */
  .sys-text {
    font-family: "Courier New", monospace;
    color: var(--text-muted);
    font-size: 0.95em;
  }

  /* 底部控制栏 */
  .control-bar {
    position: fixed;
    bottom: 0;
    left: var(--sidebar-width);
    right: 0;
    height: 56px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 40;
    font-family: var(--font-ui);
    font-size: 13px;
    transition: left 0.3s;
  }

  .control-group { display: flex; align-items: center; gap: 8px; }

  .ctrl-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: var(--bg-primary);
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font-ui);
    transition: all 0.2s;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .ctrl-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .progress-text {
    color: var(--text-muted);
    font-size: 12px;
    min-width: 50px;
    text-align: center;
  }

  /* 设置面板 */
  .settings-panel {
    position: fixed;
    bottom: 70px;
    right: 24px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: none;
    z-index: 45;
    min-width: 220px;
    font-family: var(--font-ui);
  }
  .settings-panel.show { display: block; }

  .setting-row {
    margin-bottom: 14px;
  }
  .setting-row:last-child { margin-bottom: 0; }

  .setting-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .setting-btns {
    display: flex;
    gap: 6px;
  }

  .setting-btn {
    flex: 1;
    padding: 6px 0;
    border: 1px solid var(--border);
    background: var(--bg-primary);
    color: var(--text-secondary);
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-ui);
  }
  .setting-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* 移动端菜单按钮 */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    width: 40px;
    height: 40px;
    border: none;
    background: var(--bg-secondary);
    border-radius: 8px;
    cursor: pointer;
    z-index: 60;
    box-shadow: var(--shadow);
    color: var(--text-secondary);
    font-size: 18px;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 49;
  }

  /* 章节切换动画 */
  .chapter-content {
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 完结页 */
  #ending-page {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  .ending-icon {
    width: 80px;
    height: 80px;
    margin-bottom: 28px;
    opacity: 0.8;
  }

  .ending-title {
    font-size: 28px;
    margin-bottom: 16px;
    color: var(--accent);
  }

  .ending-text {
    max-width: 460px;
    color: var(--text-secondary);
    line-height: 1.9;
    margin-bottom: 40px;
    font-family: var(--font-ui);
    font-size: 15px;
  }

  /* ========== 响应式 ========== */
  @media (max-width: 900px) {
    .sidebar {
      transform: translateX(-100%);
    }
    .sidebar.open { transform: translateX(0); }

    .main-content {
      margin-left: 0;
      padding: 56px 20px 100px;
    }

    .control-bar { left: 0; }

    .menu-toggle { display: flex; align-items: center; justify-content: center; }

    .sidebar-overlay.show { display: block; }

    .cover-title { font-size: 32px; }
    .act-title { font-size: 22px; }
  }

  @media (max-width: 480px) {
    body { font-size: 16px; }
    .main-content { padding: 56px 16px 100px; }
    .control-bar { padding: 0 12px; }
    .ctrl-btn { padding: 8px 10px; font-size: 12px; }
    .settings-panel { right: 12px; }
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* 选中文字 */
  ::selection {
    background: var(--accent-light);
    color: var(--text-primary);
  }
</style>
</head>
<body>

<!-- 进度条 -->
<div class="progress-bar" id="progressBar"></div>

<!-- 封面页 -->
<div id="cover-page">
  <div class="cover-sun">
    <div class="pixel-sun">
      <div class="sun-mouth"></div>
    </div>
  </div>
  <h1 class="cover-title">虚拟世界里的向日葵</h1>
  <div class="cover-subtitle">一部关于记忆、选择与告别的科幻小说</div>
  <p class="cover-desc">
    这座城市习惯先给标准答案，再让人做选择。<br>
    社交平台计算亲密度，餐厅推荐最优菜品，导航规划完美路线。<br>
    可当爱情也有了评分模板，<br>
    那些说不出口的心事、笨拙的温柔、和舍不得的告别，<br>
    又该安放于何处？
  </p>
  <div class="cover-buttons">
    <button class="btn btn-primary" onclick="startReading()">开始阅读</button>
    <button class="btn btn-secondary" id="continueBtn" onclick="continueReading()" style="display:none">继续阅读</button>
  </div>
</div>

<!-- 阅读页 -->
<div id="reader-page">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="reader-layout">
    <!-- 侧边目录 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">目录</div>
        <div class="sidebar-sub">共七幕 · 全文阅读</div>
      </div>
      <ul class="toc-list" id="tocList"></ul>
    </aside>

    <!-- 正文 -->
    <main class="main-content">
      <div class="content-wrapper">
        <div class="chapter-content" id="chapterContent">
          <!-- 正文动态渲染 -->
        </div>
      </div>
    </main>
  </div>

  <!-- 底部控制栏 -->
  <div class="control-bar">
    <div class="control-group">
      <button class="ctrl-btn" id="prevBtn" onclick="prevChapter()">◀ 上一章</button>
      <button class="ctrl-btn" onclick="goToCover()">目录</button>
      <button class="ctrl-btn" id="nextBtn" onclick="nextChapter()">下一章 ▶</button>
    </div>
    <div class="control-group">
      <span class="progress-text" id="progressText">0%</span>
      <button class="ctrl-btn" onclick="toggleSettings()">设置</button>
      <button class="ctrl-btn" onclick="toggleBookmark()">书签</button>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <div class="setting-label">字号</div>
      <div class="setting-btns">
        <button class="setting-btn" onclick="setFontSize(0)">小</button>
        <button class="setting-btn" onclick="setFontSize(1)">标准</button>
        <button class="setting-btn active" onclick="setFontSize(2)">中</button>
        <button class="setting-btn" onclick="setFontSize(3)">大</button>
        <button class="setting-btn" onclick="setFontSize(4)">特大</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">行宽</div>
      <div class="setting-btns">
        <button class="setting-btn" onclick="setWidth(0)">窄</button>
        <button class="setting-btn active" onclick="setWidth(1)">标准</button>
        <button class="setting-btn" onclick="setWidth(2)">宽</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">主题</div>
      <div class="setting-btns">
        <button class="setting-btn active" onclick="setTheme('light')">日间</button>
        <button class="setting-btn" onclick="setTheme('dark')">夜间</button>
      </div>
    </div>
  </div>
</div>

<!-- 完结页 -->
<div id="ending-page">
  <div class="ending-icon">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="20" fill="#f5b041"/>
      <path d="M50 15 L50 25 M50 75 L50 85 M15 50 L25 50 M75 50 L85 50 M25 25 L32 32 M68 68 L75 75 M75 25 L68 32 M32 68 L25 75" stroke="#f5b041" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <h2 class="ending-title">全文完</h2>
  <p class="ending-text">
    那些无法遗忘的记忆，以及那些最美好的幸福，<br>
    都留在了夏天的光里。<br><br>
    感谢你读完这个故事。
  </p>
  <div class="cover-buttons">
    <button class="btn btn-primary" onclick="restartNovel()">重新阅读</button>
    <button class="btn btn-secondary" onclick="goToCover()">返回封面</button>
  </div>
</div>

<script>
// ==================== 小说数据 ====================
// 严格按照原文，不做任何修改
const novelData = [
  {
    act: "第一幕：没有最优解的爱",
    sections: [
      {
        title: "1",
        content: `
<p>这座城市习惯先给标准答案，再让人做选择。</p>
<p>社交平台为约会提供匹配分数、话题建议和关系风险提示，连"浪漫惊喜"都有模板；约会结束后，双方的终端还会弹出一条提示：本次亲密度 +8。</p>
<p>餐厅会推荐最受欢迎的菜品，导航会在出发前规划好最优路线，社交平台会为约会提供话题建议、浪漫惊喜模板和关系风险提示。甚至能根据两个人的聊天记录，计算出一段关系的亲密度。</p>
<p>约会结束后，终端还会弹出提示：</p>
<p class="sys-text">【本次互动满意度：86%。】</p>
<p class="sys-text">【关系亲密度：+8。】</p>

<h4>1.</h4>
<p>香第一次觉得自己可能真的喜欢上树，是在一场由系统安排得过分妥帖的虚拟约会里。</p>
<p>她戴上轻量化的沉浸式眼镜，眼前的房间逐渐褪去，取而代之的是一间临海咖啡馆。窗外有海浪，桌上摆着两杯冒着热气的咖啡，背景音乐的音量恰好低于人声，连海风吹过发梢的触感都模拟得恰到好处。</p>
<p>屏幕右下角弹出一行提示。</p>
<p class="sys-text">【本次互动推荐主题：旅游经历。】</p>
<p class="sys-text">【建议情绪节奏：轻松—共鸣—适度自我披露。】</p>
<p>香看了一眼，忍不住笑。</p>
<p>"你有没有觉得，我们像在参加什么面试？"</p>
<p>对面的人抬起头。</p>
<p>树穿着简单的衬衫，斯文清秀，带着一点少年气。</p>
<p>如果不是系统介绍上写着27岁，她还以为是一个刚毕业的大学生。</p>
<p>他没有立刻回答，而是低头看了眼桌面上的提示。</p>
<p>"那面试的话，我是不是应该先介绍一下自己的优点？"</p>
<p>"可以啊，请控制在三分钟以内。"香附和着他的话说道。</p>
<p>"我出去旅游会提前做好攻略，知道哪里有好吃的，也会主动帮忙提行李。"</p>
<p>"听起来不错。"</p>
<p>"不过方向感不太好，容易走错路。"</p>
<p>"怎么还把缺点说出来了？"</p>
<p>"至少你以后不会对我记路这件事抱有太高期待。"</p>
<p>香笑出了声。</p>
<p>那是她第一次发现，树偶尔冒出来的一句玩笑，比系统推荐的任何话题都管用。</p>
<p>他们通过兴趣匹配认识，聊了三个多月。</p>
<p>两个人都喜欢老电影、美食和一些复古的小物件。平台为他们生成过许多恰到好处的聊天话题，提醒他们记得日常分享，也安排过虚拟电影、双人游戏和节日惊喜。</p>

// ==================== 状态管理 ====================
let currentAct = 0;
let currentSection = 0;
let totalChapters = 0;
let flatChapters = [];
let fontSizeLevel = 2;
let widthLevel = 1;
let currentTheme = 'light';

// 初始化扁平化章节列表
function initChapters() {
  flatChapters = [];
  novelData.forEach((act, actIdx) => {
    act.sections.forEach((sec, secIdx) => {
      flatChapters.push({ actIdx, secIdx, act: act.act, title: sec.title, content: sec.content });
    });
  });
  totalChapters = flatChapters.length;
}

// 计算当前章节的全局索引
function getGlobalIndex() {
  let idx = 0;
  for (let i = 0; i < currentAct; i++) {
    idx += novelData[i].sections.length;
  }
  idx += currentSection;
  return idx;
}

// ==================== 渲染目录 ====================
function renderTOC() {
  const tocList = document.getElementById('tocList');
  tocList.innerHTML = '';

  novelData.forEach((act, actIdx) => {
    const actLi = document.createElement('li');
    const actDiv = document.createElement('div');
    actDiv.className = 'toc-act';
    actDiv.innerHTML = `<span class="toggle-icon">▼</span> ${act.act}`;
    actDiv.onclick = () => toggleAct(actIdx);
    
    const chaptersUl = document.createElement('ul');
    chaptersUl.className = 'toc-chapters';
    
    act.sections.forEach((sec, secIdx) => {
      const chapLi = document.createElement('li');
      chapLi.className = 'toc-chapter';
      chapLi.textContent = `第 ${sec.title} 节`;
      chapLi.onclick = (e) => {
        e.stopPropagation();
        goToChapter(actIdx, secIdx);
      };
      if (actIdx === currentAct && secIdx === currentSection) {
        chapLi.classList.add('active');
      }
      chaptersUl.appendChild(chapLi);
    });

    // 默认展开当前幕
    if (actIdx === currentAct) {
      // 展开
    } else {
      actDiv.classList.add('collapsed');
      chaptersUl.style.maxHeight = '0';
    }

    actLi.appendChild(actDiv);
    actLi.appendChild(chaptersUl);
    tocList.appendChild(actLi);
  });
}

function toggleAct(actIdx) {
  const actDivs = document.querySelectorAll('.toc-act');
  const chaptersUls = document.querySelectorAll('.toc-chapters');
  
  if (actDivs[actIdx].classList.contains('collapsed')) {
    actDivs[actIdx].classList.remove('collapsed');
    chaptersUls[actIdx].style.maxHeight = chaptersUls[actIdx].scrollHeight + 'px';
  } else {
    actDivs[actIdx].classList.add('collapsed');
    chaptersUls[actIdx].style.maxHeight = '0';
  }
}

// ==================== 渲染正文 ====================
function renderChapter() {
  const act = novelData[currentAct];
  const section = act.sections[currentSection];
  
  const content = `
    <div class="chapter-header">
      <div class="act-title">${act.act}</div>
      <div class="section-title">第 ${section.title} 节</div>
    </div>
    <div class="novel-content">
      ${section.content}
    </div>
  `;
  
  document.getElementById('chapterContent').innerHTML = content;
  document.getElementById('chapterContent').classList.remove('chapter-content');
  void document.getElementById('chapterContent').offsetWidth; // 触发重绘
  document.getElementById('chapterContent').classList.add('chapter-content');
  
  renderTOC();
  updateButtons();
  updateProgress();
  saveProgress();
  window.scrollTo(0, 0);
}

function updateButtons() {
  const globalIdx = getGlobalIndex();
  document.getElementById('prevBtn').disabled = globalIdx === 0;
  document.getElementById('nextBtn').disabled = globalIdx === totalChapters - 1;
}

// ==================== 章节跳转 ====================
function goToChapter(actIdx, secIdx) {
  currentAct = actIdx;
  currentSection = secIdx;
  renderChapter();
  
  // 移动端关闭侧边栏
  if (window.innerWidth <= 900) {
    closeSidebar();
  }
}

function prevChapter() {
  if (currentSection > 0) {
    currentSection--;
  } else if (currentAct > 0) {
    currentAct--;
    currentSection = novelData[currentAct].sections.length - 1;
  } else {
    return;
  }
  renderChapter();
}

function nextChapter() {
  if (currentSection < novelData[currentAct].sections.length - 1) {
    currentSection++;
  } else if (currentAct < novelData.length - 1) {
    currentAct++;
    currentSection = 0;
  } else {
    showEnding();
    return;
  }
  renderChapter();
}

// ==================== 页面切换 ====================
function showPage(pageId) {
  document.getElementById('cover-page').style.display = 'none';
  document.getElementById('reader-page').style.display = 'none';
  document.getElementById('ending-page').style.display = 'none';
  
  if (pageId === 'cover') {
    document.getElementById('cover-page').style.display = 'flex';
  } else if (pageId === 'reader') {
    document.getElementById('reader-page').style.display = 'block';
  } else if (pageId === 'ending') {
    document.getElementById('ending-page').style.display = 'flex';
  }
}

function startReading() {
  currentAct = 0;
  currentSection = 0;
  showPage('reader');
  renderChapter();
}

function continueReading() {
  const saved = localStorage.getItem('sunflower_progress');
  if (saved) {
    const data = JSON.parse(saved);
    currentAct = data.act || 0;
    currentSection = data.section || 0;
  }
  showPage('reader');
  renderChapter();
}

function goToCover() {
  showPage('cover');
}

function showEnding() {
  showPage('ending');
}

function restartNovel() {
  currentAct = 0;
  currentSection = 0;
  showPage('reader');
  renderChapter();
}

// ==================== 阅读进度 ====================
function updateProgress() {
  const globalIdx = getGlobalIndex();
  const percent = Math.round(((globalIdx + 1) / totalChapters) * 100);
  document.getElementById('progressText').textContent = percent + '%';
  
  // 顶部进度条
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrollPercent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = scrollPercent + '%';
}

function saveProgress() {
  localStorage.setItem('sunflower_progress', JSON.stringify({
    act: currentAct,
    section: currentSection
  }));
}

// ==================== 设置功能 ====================
function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('show');
}

function setFontSize(level) {
  fontSizeLevel = level;
  const sizes = [14, 15.5, 17, 18.5, 20];
  document.body.style.fontSize = sizes[level] + 'px';
  
  // 更新按钮状态
  document.querySelectorAll('.setting-row')[0].querySelectorAll('.setting-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === level);
  });
  
  localStorage.setItem('sunflower_fontSize', level);
}

function setWidth(level) {
  widthLevel = level;
  const widths = ['560px', '720px', '900px'];
  document.querySelector('.content-wrapper').style.maxWidth = widths[level];
  
  document.querySelectorAll('.setting-row')[1].querySelectorAll('.setting-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === level);
  });
  
  localStorage.setItem('sunflower_width', level);
}

function setTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  
  document.querySelectorAll('.setting-row')[2].querySelectorAll('.setting-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && theme === 'light') || (i === 1 && theme === 'dark'));
  });
  
  localStorage.setItem('sunflower_theme', theme);
}

// ==================== 书签 ====================
function toggleBookmark() {
  const bookmark = localStorage.getItem('sunflower_bookmark');
  if (bookmark) {
    const data = JSON.parse(bookmark);
    if (confirm(`已存在书签：${novelData[data.act].act} 第${novelData[data.act].sections[data.section].title}节\n是否跳转到书签位置？`)) {
      currentAct = data.act;
      currentSection = data.section;
      renderChapter();
    } else if (confirm('是否覆盖当前书签？')) {
      setBookmark();
    }
  } else {
    setBookmark();
  }
}

function setBookmark() {
  localStorage.setItem('sunflower_bookmark', JSON.stringify({
    act: currentAct,
    section: currentSection
  }));
  alert('已添加书签');
}

// ==================== 侧边栏 ====================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ==================== 键盘快捷键 ====================
document.addEventListener('keydown', (e) => {
  if (document.getElementById('reader-page').style.display !== 'block') return;
  
  if (e.key === 'ArrowLeft') {
    prevChapter();
  } else if (e.key === 'ArrowRight') {
    nextChapter();
  } else if (e.key === 'Escape') {
    goToCover();
  }
});

// 滚动监听
window.addEventListener('scroll', updateProgress);

// 点击外部关闭设置面板
document.addEventListener('click', (e) => {
  const panel = document.getElementById('settingsPanel');
  if (!panel.contains(e.target) && !e.target.textContent.includes('设置')) {
    panel.classList.remove('show');
  }
});

// ==================== 初始化 ====================
function init() {
  initChapters();
  
  // 恢复设置
  const savedFont = localStorage.getItem('sunflower_fontSize');
  if (savedFont !== null) setFontSize(parseInt(savedFont));
  
  const savedWidth = localStorage.getItem('sunflower_width');
  if (savedWidth !== null) setWidth(parseInt(savedWidth));
  
  const savedTheme = localStorage.getItem('sunflower_theme');
  if (savedTheme) setTheme(savedTheme);
  
  // 检查是否有阅读进度
  const savedProgress = localStorage.getItem('sunflower_progress');
  if (savedProgress) {
    document.getElementById('continueBtn').style.display = 'inline-block';
  }
}

init();
</script>
